<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneGameStudio · AI 游戏工作室</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235a3a22'/%3E%3Crect x='1' y='1' width='14' height='14' fill='%23fff3d6'/%3E%3Crect x='3' y='3' width='5' height='5' fill='%23f2b134'/%3E%3Crect x='8' y='8' width='5' height='5' fill='%236fbf73'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css?v=20261025k" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" title="OneGameStudio">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">OneGameStudio</span>
        <span class="ver">v0.10</span>
      </div>

      <figure class="brand-banner" aria-hidden="true">
        <img
          src="/assets/studio-banner.jpg"
          alt=""
          width="640"
          height="271"
          decoding="async"
        />
      </figure>

      <div class="status-group" aria-label="公司状态">
        <span id="mode-badge" class="badge badge-wait" title="运行模式"
          >模式 —</span
        >
        <span id="sop-badge" class="badge badge-wait">SOP --</span>
        <span id="conn" class="badge badge-wait">连接中…</span>
        <span id="task-status" class="badge badge-wait">空闲</span>
        <span id="task-id" class="task-id" title="当前任务 ID"></span>
      </div>
    </header>

    <main class="layout">
      <div class="office-col">
        <section class="office panel">
          <div class="panel-head">
            <span class="panel-title">像素办公室</span>
            <span id="office-task" class="muted">尚未分配任务</span>
          </div>
          <div class="office-viewport">
            <div class="office-toolbar" aria-label="办公室视角控制">
              <button
                id="office-zoom-out"
                type="button"
                class="ghost"
                aria-label="缩小办公室"
              >
                −
              </button>
              <output id="office-zoom" aria-live="polite">130%</output>
              <button
                id="office-zoom-in"
                type="button"
                class="ghost"
                aria-label="放大办公室"
              >
                +
              </button>
              <button id="office-reset" type="button" class="ghost">
                复位视角
              </button>
            </div>
            <div class="office-stage">
              <canvas
                id="office"
                width="960"
                height="600"
                aria-label="可缩放和拖动的 2.5D 等距像素办公室"
              ></canvas>
              <div
                id="office-hotspots"
                class="office-hotspots"
                aria-label="办公室工位，点击查看员工档案"
              ></div>
            </div>
          </div>
        </section>

        <section class="command panel" aria-label="CEO 指令台">
          <div class="panel-head">
            <span class="panel-title">CEO 指令台</span>
            <span class="muted">发布开发任务</span>
          </div>
          <form id="ceo-form" class="ceo-console" autocomplete="off">
            <label class="field field-req">
              <span class="field-label">开发需求</span>
              <input
                id="requirement"
                type="text"
                maxlength="200"
                placeholder="例如：做一个能计分的贪吃蛇小游戏"
                required
              />
            </label>
            <label class="field field-sop">
              <span class="field-label">SOP 模式</span>
              <select id="sop-mode" title="SOP 模式：auto 由后端规则自动选择">
                <option value="auto">SOP AUTO</option>
                <option value="fast">FAST</option>
                <option value="balanced">BALANCED</option>
                <option value="creative">CREATIVE</option>
              </select>
            </label>
            <label class="field field-src">
              <span class="field-label">来源版本（继续开发）</span>
              <select
                id="source-version"
                class="source-input"
                title="选择历史任务作为本次执行的来源版本，按时间降序"
              >
                <option value="">不使用来源版本</option>
              </select>
            </label>
            <button id="submit" type="submit" class="btn-primary">
              开始开发
            </button>
          </form>
        </section>
      </div>

      <aside class="deliverables panel">
        <div class="panel-head">
          <span class="panel-title">游戏工作台</span>
        </div>
        <nav class="tabs" id="tabs" aria-label="游戏工作台标签">
          <button type="button" data-tab="game" class="active">游戏</button>
          <button type="button" data-tab="studio">企划</button>
          <button type="button" data-tab="review">审查</button>
          <button type="button" data-tab="marketing">宣传</button>
          <button type="button" data-tab="employee">员工</button>
          <button type="button" data-tab="logs">日志</button>
        </nav>

        <div class="tab-body">
          <section id="tab-game" class="tab-pane">
            <div class="game-bar">
              <span id="game-version" class="muted">尚无产物</span>
              <select
                id="version-select"
                class="version-select"
                title="选择工程师生成的游戏版本，预览后可回退"
              >
                <option value="index.html">当前版本</option>
              </select>
              <button
                id="rollback-version"
                type="button"
                class="ghost"
                disabled
              >
                回退到此版本
              </button>
              <span class="hint">点击画面后按方向键操作</span>
              <button id="reload-preview" type="button" class="ghost">
                刷新预览
              </button>
            </div>
            <div class="frame-wrap">
              <iframe
                id="game-frame"
                title="游戏预览"
                sandbox="allow-scripts"
                referrerpolicy="no-referrer"
              ></iframe>
              <div id="preview-error" class="overlay hidden">
                <strong>预览加载失败</strong>
                <span id="preview-error-detail"></span>
              </div>
              <div id="preview-empty" class="overlay">
                <span class="overlay-icon" aria-hidden="true"></span>
                <span>游戏生成后会出现在这里</span>
              </div>
            </div>
          </section>

          <section id="tab-studio" class="tab-pane hidden">
            <div id="studio-body" class="scroll"></div>
          </section>

          <section id="tab-review" class="tab-pane hidden">
            <div id="review-body" class="scroll"></div>
          </section>

          <section id="tab-marketing" class="tab-pane hidden">
            <div id="marketing-body" class="scroll"></div>
          </section>

          <section id="tab-employee" class="tab-pane hidden">
            <div class="talent-wrap">
              <div id="talent-list" class="talent-list scroll"></div>
              <div id="talent-detail" class="talent-detail scroll">
                <p class="muted">
                  6
                  个职位，每个职位下展示对应角色；点开角色查看基础信息与完成过的任务。
                </p>
              </div>
            </div>
          </section>

          <section id="tab-logs" class="tab-pane hidden">
            <div id="log-list" class="scroll log-list"></div>
          </section>
        </div>
      </aside>
    </main>

    <footer class="logbar">
      <span class="logbar-title">公司广播</span>
      <div id="log-strip" class="log-strip"></div>
    </footer>

    <script src="/office.js?v=20261025k"></script>
    <script src="/app.js?v=20261025j"></script>
    <script src="/talent.js?v=20261025j"></script>
  </body>
</html>
