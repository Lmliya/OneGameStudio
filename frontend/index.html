<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneGameStudio · AI 游戏工作室</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d0f17'/%3E%3Crect x='2' y='2' width='6' height='6' fill='%237ee787'/%3E%3Crect x='8' y='8' width='6' height='6' fill='%2358a6ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css?v=20261024h" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">▚</span> ONEGAMESTUDIO
        <span class="ver">v0.9</span>
      </div>

      <form id="ceo-form" class="ceo-console" autocomplete="off">
        <input
          id="requirement"
          type="text"
          maxlength="200"
          placeholder="CEO 需求：例如做一个能计分的贪吃蛇小游戏"
          required
        />
        <select id="sop-mode" title="SOP 模式：auto 由后端规则自动选择">
          <option value="auto">SOP AUTO</option>
          <option value="fast">FAST</option>
          <option value="balanced">BALANCED</option>
          <option value="creative">CREATIVE</option>
        </select>
        <input
          id="source-version"
          class="source-input"
          type="text"
          placeholder="来源版本 ID（可选）"
          title="填写历史版本 ID 可从该版本创建创新分支"
        />
        <button id="submit" type="submit">开始开发</button>
      </form>

      <div class="status-group">
        <span id="mode-badge" class="badge badge-wait" title="运行模式"
          >模式 —</span
        >
        <span id="sop-badge" class="badge badge-wait">SOP --</span>
        <span id="conn" class="badge badge-wait">连接中…</span>
        <span id="task-status" class="badge badge-wait">空闲</span>
        <span id="task-id" class="task-id"></span>
      </div>
    </header>

    <main class="layout">
      <section class="office panel">
        <div class="panel-head">
          <span>像素办公室</span>
          <span id="office-task" class="muted">尚未分配任务</span>
        </div>
        <canvas id="office" width="880" height="520"></canvas>
      </section>

      <aside class="deliverables panel">
        <nav class="tabs" id="tabs">
          <button type="button" data-tab="game" class="active">Game</button>
          <button type="button" data-tab="studio">Studio</button>
          <button type="button" data-tab="review">Review</button>
          <button type="button" data-tab="marketing">Marketing</button>
          <button type="button" data-tab="employee">Employee</button>
          <button type="button" data-tab="logs">Logs</button>
        </nav>

        <div class="tab-body">
          <section id="tab-game" class="tab-pane">
            <div class="game-bar">
              <span id="game-version" class="muted">尚无产物</span>
              <span class="hint">点击画面后按方向键操作</span>
              <button id="reload-preview" type="button" class="ghost">
                刷新预览
              </button>
            </div>
            <div class="frame-wrap">
              <iframe
                id="game-frame"
                title="游戏预览"
                sandbox="allow-scripts"
                referrerpolicy="no-referrer"
              ></iframe>
              <div id="preview-error" class="overlay hidden">
                <strong>预览加载失败</strong>
                <span id="preview-error-detail"></span>
              </div>
              <div id="preview-empty" class="overlay">
                <span>游戏生成后会出现在这里</span>
              </div>
            </div>
          </section>

          <section id="tab-studio" class="tab-pane hidden">
            <div id="studio-body" class="scroll"></div>
          </section>

          <section id="tab-review" class="tab-pane hidden">
            <div id="review-body" class="scroll"></div>
          </section>

          <section id="tab-marketing" class="tab-pane hidden">
            <div id="marketing-body" class="scroll"></div>
          </section>

          <section id="tab-employee" class="tab-pane hidden">
            <div class="talent-wrap">
              <div id="talent-list" class="talent-list scroll"></div>
              <div id="talent-detail" class="talent-detail scroll">
                <p class="muted">
                  6
                  个职位，每个职位下展示对应角色；点开角色查看基础信息与完成过的任务。
                </p>
              </div>
            </div>
          </section>

          <section id="tab-logs" class="tab-pane hidden">
            <div id="log-list" class="scroll log-list"></div>
          </section>
        </div>
      </aside>
    </main>

    <footer class="logbar">
      <span class="logbar-title">事件</span>
      <div id="log-strip" class="log-strip"></div>
    </footer>

    <script src="/office.js?v=20261024g"></script>
    <script src="/app.js?v=20261024h"></script>
    <script src="/talent.js?v=20261024h"></script>
  </body>
</html>
