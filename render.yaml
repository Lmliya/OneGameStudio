services:
  - type: web
    name: onegamestudio-demo
    runtime: docker
    # 免费层：无持久磁盘、15 分钟无流量休眠；只读 Demo 足够使用
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: demo
      - key: DEMO_READ_ONLY
        value: "true"
      - key: MOCK_MODE
        value: "true"
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: EVOLUTION_DIR
        value: /tmp/evolution
      - key: DEMO_DIR
        value: /app/demo/tasks
      # Live 模式才需要；在 Render 控制台手动填写，不要写进仓库
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ACCESS_TOKEN
        sync: false
