services:
  - type: web
    name: onegamestudio-demo
    runtime: docker
    # 免费层：无持久磁盘、15 分钟无流量休眠；Demo + Mock 可交互但不调用真实模型
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: demo
      # 允许在线上提交任务；Mock 模式不会调用真实模型、不产生 token 费用
      - key: DEMO_READ_ONLY
        value: "false"
      - key: MOCK_MODE
        value: "true"
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: EVOLUTION_DIR
        value: /tmp/evolution
      - key: DEMO_DIR
        value: /app/demo/tasks
      # Live 模式才需要，在 Render 控制台 Environment 页手动添加（不要写进仓库）：
      #   LLM_API_KEY、LLM_MODEL、LLM_BASE_URL、ACCESS_TOKEN
      # 同时把 APP_MODE 改为 live、MOCK_MODE 改为 false、DEMO_READ_ONLY 改为 false
