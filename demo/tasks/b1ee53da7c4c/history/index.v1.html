<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Ember Snake</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 25%, #991b1b 0%, #631010 55%, #2e0505 100%);
    color: #fef2f2;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }
  .game-shell {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(69, 10, 10, 0.76);
    border: 1px solid rgba(252, 165, 165, 0.32);
    border-radius: 18px;
    padding: 14px 16px 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.68), 0 0 32px rgba(239, 68, 68, 0.22);
    backdrop-filter: blur(12px);
  }
  .top-bar {
    width: 400px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.6px;
    color: #fde047;
    text-shadow: 0 0 12px rgba(250, 204, 21, 0.45);
  }
  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #fb923c;
    box-shadow: 0 0 10px #fb923c;
  }
  .ctrl-group {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    background: rgba(87, 13, 13, 0.85);
    color: #fecaca;
    border: 1px solid rgba(252, 165, 165, 0.35);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .icon-btn:hover {
    background: rgba(248, 113, 113, 0.28);
    color: #fff;
    border-color: #fde047;
  }
  #hud {
    width: 400px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .stat-card {
    background: rgba(48, 6, 6, 0.8);
    border: 1px solid rgba(252, 165, 165, 0.24);
    border-radius: 10px;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #fca5a5;
    opacity: 0.88;
  }
  .stat-val {
    font-size: 18px;
    font-weight: 800;
    font-family: 'Consolas', 'SF Mono', monospace;
    color: #fffbeb;
    margin-top: 1px;
  }
  #score { color: #fde047; text-shadow: 0 0 10px rgba(253, 224, 71, 0.45); }
  #best { color: #fca5a5; }
  #speed { color: #fb923c; }
  .stage-wrap {
    position: relative;
    width: 400px;
    height: 400px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 26px rgba(248, 113, 113, 0.3), inset 0 0 18px rgba(0, 0, 0, 0.55);
    border: 2px solid #fca5a5;
  }
  canvas {
    display: block;
    background: #571010;
  }
  #restart {
    margin-top: 12px;
    padding: 9px 24px;
    background: linear-gradient(135deg, #fde047 0%, #fb923c 100%);
    color: #450a0a;
    border: 0;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(251, 146, 60, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #restart:hover {
    transform: translateY(-1px) scale(1.03);
    box-shadow: 0 8px 25px rgba(253, 224, 71, 0.65);
  }
  #restart:active { transform: translateY(1px); }
  .footer-bar {
    width: 400px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 11px;
    color: #fecaca;
    opacity: 0.88;
  }
  .dpad {
    display: flex;
    gap: 5px;
  }
  .dpad-btn {
    width: 28px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid rgba(252, 165, 165, 0.35);
    background: rgba(87, 13, 13, 0.78);
    color: #fef2f2;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dpad-btn:hover { background: rgba(248, 113, 113, 0.35); }
</style>
</head>
<body>
  <div class="game-shell">
    <div class="top-bar">
      <div class="brand"><span class="brand-dot"></span>CRIMSON EMBER SNAKE</div>
      <div class="ctrl-group">
        <button type="button" class="icon-btn" id="pauseBtn" title="空格键暂停/继续">暂停</button>
        <button type="button" class="icon-btn" id="soundBtn" title="切换音效">音效: 开</button>
      </div>
    </div>

    <div id="hud">
      <div class="stat-card">
        <span class="stat-label">SCORE</span>
        <span class="stat-val" id="score">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">BEST</span>
        <span class="stat-val" id="best">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">SPEED</span>
        <span class="stat-val" id="speed">1.0x</span>
      </div>
    </div>

    <div class="stage-wrap">
      <canvas id="game" width="400" height="400"></canvas>
    </div>

    <button id="restart" hidden>重新开始</button>

    <div class="footer-bar">
      <span>方向键 / WASD 移动 · 空格暂停</span>
      <div class="dpad">
        <button type="button" class="dpad-btn" data-dir="left" aria-label="左">◀</button>
        <button type="button" class="dpad-btn" data-dir="up" aria-label="上">▲</button>
        <button type="button" class="dpad-btn" data-dir="down" aria-label="下">▼</button>
        <button type="button" class="dpad-btn" data-dir="right" aria-label="右">▶</button>
      </div>
    </div>
  </div>

<script>
(function () {
  var CELL = 20, COLS = 20, BASE_TICK = 120;
  var STORAGE_KEY = 'ogs_crimson_red_snake_best_v1';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var speedEl = document.getElementById('speed');
  var restartBtn = document.getElementById('restart');
  var pauseBtn = document.getElementById('pauseBtn');
  var soundBtn = document.getElementById('soundBtn');

  var snake = [];
  var dir = { x: 1, y: 0 };
  var lastMovedDir = { x: 1, y: 0 };
  var dirQueue = [];
  var food = { x: 5, y: 5 };
  var bonusFood = null;
  var foodsEaten = 0;
  var score = 0;
  var bestScore = 0;
  var tickMs = BASE_TICK;
  var over = false;
  var paused = false;
  var newRecord = false;
  var timer = null;
  var rafId = null;
  var soundEnabled = true;
  var audioCtx = null;
  var particles = [];
  var popups = [];
  var shakeFrames = 0;

  try {
    bestScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
  } catch (e) { bestScore = 0; }
  bestEl.textContent = String(bestScore);

  function playTone(freq, type, duration, vol, slideTo) {
    if (!soundEnabled) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function sfxEat() {
    playTone(587, 'triangle', 0.09, 0.09, 880);
    setTimeout(function () { playTone(880, 'sine', 0.11, 0.07, 1174); }, 45);
  }
  function sfxBonus() {
    playTone(659, 'triangle', 0.08, 0.1, 987);
    setTimeout(function () { playTone(987, 'triangle', 0.09, 0.1, 1318); }, 55);
    setTimeout(function () { playTone(1318, 'sine', 0.16, 0.1, 1760); }, 110);
  }
  function sfxOver() {
    playTone(220, 'sawtooth', 0.28, 0.09, 70);
  }

  function randCell() { return Math.floor(Math.random() * COLS); }

  function isOccupied(x, y) {
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
  }

  function placeFood() {
    var p, guard = 0;
    do {
      p = { x: randCell(), y: randCell() };
      guard++;
    } while (isOccupied(p.x, p.y) && guard < 500);
    food = p;
  }

  function maybeSpawnBonus() {
    if (bonusFood) return;
    var p, guard = 0;
    do {
      p = { x: randCell(), y: randCell(), ttl: 45, maxTtl: 45 };
      guard++;
    } while ((isOccupied(p.x, p.y) || (p.x === food.x && p.y === food.y)) && guard < 500);
    bonusFood = p;
  }

  function spawnBurst(gx, gy, color, count) {
    var cx = gx * CELL + CELL / 2;
    var cy = gy * CELL + CELL / 2;
    for (var i = 0; i < (count || 14); i++) {
      var ang = (Math.PI * 2 * i) / (count || 14) + (Math.random() - 0.5) * 0.4;
      var spd = 1.2 + Math.random() * 2.6;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: 2 + Math.random() * 2.5,
        alpha: 1,
        color: color
      });
    }
  }

  function spawnPopup(gx, gy, text, color) {
    popups.push({
      x: gx * CELL + CELL / 2,
      y: gy * CELL + 6,
      text: text,
      color: color || '#fde047',
      alpha: 1,
      vy: -0.9
    });
  }

  function updateSpeed() {
    var target = Math.max(68, BASE_TICK - Math.floor(score / 30) * 6);
    if (target !== tickMs) {
      tickMs = target;
      if (timer && !over && !paused) {
        clearInterval(timer);
        timer = setInterval(tick, tickMs);
      }
    }
    var mult = (BASE_TICK / tickMs).toFixed(1) + 'x';
    speedEl.textContent = mult;
  }

  function addScore(pts, gx, gy, isBonus) {
    score += pts;
    scoreEl.textContent = String(score);
    if (score > bestScore) {
      bestScore = score;
      newRecord = true;
      bestEl.textContent = String(bestScore);
      try { localStorage.setItem(STORAGE_KEY, String(bestScore)); } catch (e) {}
    }
    updateSpeed();
    spawnPopup(gx, gy, '+' + pts + (isBonus ? ' BONUS!' : ''), isBonus ? '#4ade80' : '#fde047');
  }

  function roundRectPath(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    lastMovedDir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    foodsEaten = 0;
    tickMs = BASE_TICK;
    over = false;
    paused = false;
    newRecord = false;
    bonusFood = null;
    particles = [];
    popups = [];
    shakeFrames = 0;
    scoreEl.textContent = '0';
    speedEl.textContent = '1.0x';
    pauseBtn.textContent = '暂停';
    restartBtn.hidden = true;
    placeFood();
    if (timer) clearInterval(timer);
    timer = setInterval(tick, tickMs);
    draw();
  }

  function gameOver() {
    over = true;
    shakeFrames = 10;
    if (timer) clearInterval(timer);
    restartBtn.hidden = false;
    sfxOver();
    draw();
  }

  function tick() {
    if (over || paused) return;

    if (dirQueue.length > 0) {
      dir = dirQueue.shift();
    }
    lastMovedDir = { x: dir.x, y: dir.y };

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= COLS) {
      return gameOver();
    }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        return gameOver();
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      foodsEaten++;
      addScore(10, head.x, head.y, false);
      spawnBurst(head.x, head.y, '#fde047', 15);
      sfxEat();
      placeFood();
      if (foodsEaten % 5 === 0) maybeSpawnBonus();
    } else if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
      addScore(30, head.x, head.y, true);
      spawnBurst(head.x, head.y, '#4ade80', 22);
      sfxBonus();
      bonusFood = null;
    } else {
      var tail = snake.pop();
      if (Math.random() < 0.35) {
        particles.push({
          x: tail.x * CELL + CELL / 2,
          y: tail.y * CELL + CELL / 2,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          r: 1.8,
          alpha: 0.55,
          color: '#fca5a5'
        });
      }
    }

    if (bonusFood) {
      bonusFood.ttl--;
      if (bonusFood.ttl <= 0) bonusFood = null;
    }

    if (dirQueue.length > 0) {
      dir = { x: dirQueue[0].x, y: dirQueue[0].y };
    }

    draw();
  }

  function updateEffects() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.alpha -= 0.032;
      if (p.alpha <= 0) particles.splice(i, 1);
    }
    for (var j = popups.length - 1; j >= 0; j--) {
      var pop = popups[j];
      pop.y += pop.vy;
      pop.alpha -= 0.028;
      if (pop.alpha <= 0) popups.splice(j, 1);
    }
    if (shakeFrames > 0) shakeFrames--;
  }

  function draw() {
    var now = Date.now();
    ctx.save();
    if (shakeFrames > 0) {
      var dx = (Math.random() - 0.5) * 5;
      var dy = (Math.random() - 0.5) * 5;
      ctx.translate(dx, dy);
    }

    // 1. 赤焰暗红棋盘格背景
    for (var r = 0; r < COLS; r++) {
      for (var c = 0; c < COLS; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#571010' : '#651414';
        ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
      }
    }

    // 2. 耀眼金果食物（带呼吸发光）
    var pulse = 1 + Math.sin(now * 0.008) * 0.12;
    var fx = food.x * CELL + CELL / 2;
    var fy = food.y * CELL + CELL / 2;
    ctx.save();
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(fx, fy, (CELL * 0.38) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(fx - 2.2, fy - 2.2, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 3. 限时翡翠晶石奖励果
    if (bonusFood) {
      var bx = bonusFood.x * CELL + CELL / 2;
      var by = bonusFood.y * CELL + CELL / 2;
      var bp = 1 + Math.sin(now * 0.015) * 0.16;
      ctx.save();
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(bx, by, (CELL * 0.42) * bp, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(74, 222, 128, 0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bx, by, CELL * 0.48, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * bonusFood.ttl) / bonusFood.maxTtl);
      ctx.stroke();
      ctx.restore();
    }

    // 4. 绘制暖金至珊瑚粉渐变蛇身与高光蛇头
    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      var isHead = i === 0;
      var ratio = i / Math.max(1, snake.length - 1);
      var pad = isHead ? 1 : 1.5 + ratio * 2.2;
      var sx = seg.x * CELL + pad;
      var sy = seg.y * CELL + pad;
      var sw = CELL - pad * 2;
      var sh = CELL - pad * 2;

      ctx.save();
      if (isHead) {
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#fffbeb';
      } else {
        var g = Math.round(230 - ratio * 65);
        var b = Math.round(138 + ratio * 27);
        ctx.fillStyle = 'rgb(253,' + g + ',' + b + ')';
      }
      roundRectPath(sx, sy, sw, sh, isHead ? 6 : 5);
      ctx.fill();

      // 蛇头眼睛与高光
      if (isHead) {
        var cx = seg.x * CELL + CELL / 2;
        var cy = seg.y * CELL + CELL / 2;
        var ex1 = cx + dir.x * 3 - dir.y * 4;
        var ey1 = cy + dir.y * 3 + dir.x * 4;
        var ex2 = cx + dir.x * 3 + dir.y * 4;
        var ey2 = cy + dir.y * 3 - dir.x * 4;
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#450a0a';
        ctx.beginPath();
        ctx.arc(ex1, ey1, 2.3, 0, Math.PI * 2);
        ctx.arc(ex2, ey2, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ex1 + dir.x * 0.6, ey1 + dir.y * 0.6, 0.9, 0, Math.PI * 2);
        ctx.arc(ex2 + dir.x * 0.6, ey2 + dir.y * 0.6, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 5. 粒子特效
    for (var k = 0; k < particles.length; k++) {
      var pt = particles[k];
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.alpha);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 6. 浮动加分飘字
    for (var m = 0; m < popups.length; m++) {
      var pop = popups[m];
      ctx.save();
      ctx.globalAlpha = Math.max(0, pop.alpha);
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, pop.x, pop.y);
      ctx.restore();
    }

    // 7. 暂停遮罩
    if (paused && !over) {
      ctx.fillStyle = 'rgba(35, 4, 4, 0.72)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('已暂停 (PAUSED)', canvas.width / 2, canvas.height / 2 - 6);
      ctx.fillStyle = '#fecaca';
      ctx.font = '13px sans-serif';
      ctx.fillText('按空格键或点击顶部按钮继续', canvas.width / 2, canvas.height / 2 + 20);
    }

    // 8. 游戏结束结算层
    if (over) {
      ctx.fillStyle = 'rgba(28, 3, 3, 0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(69, 10, 10, 0.94)';
      ctx.strokeStyle = 'rgba(252, 165, 165, 0.55)';
      ctx.lineWidth = 1.5;
      roundRectPath(70, 115, 260, 170, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 26px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width / 2, 158);

      ctx.fillStyle = '#fef2f2';
      ctx.font = '15px sans-serif';
      ctx.fillText('本局得分: ' + score + '   最高纪录: ' + bestScore, canvas.width / 2, 196);

      if (newRecord && score > 0) {
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('★ 新纪录达成 NEW RECORD! ★', canvas.width / 2, 226);
      } else {
        ctx.fillStyle = '#fca5a5';
        ctx.font = '12px sans-serif';
        ctx.fillText('点击下方「重新开始」或按 Enter 再战一局', canvas.width / 2, 228);
      }
    }

    ctx.restore();
  }

  function renderLoop() {
    updateEffects();
    if (!over) draw();
    else if (shakeFrames > 0 || particles.length > 0) draw();
    rafId = requestAnimationFrame(renderLoop);
  }

  function queueDirection(nx, ny) {
    if (over || paused) return;
    var ref = dirQueue.length > 0 ? dirQueue[dirQueue.length - 1] : lastMovedDir;
    if (nx === -ref.x && ny === -ref.y) return;
    if (nx === ref.x && ny === ref.y) return;
    if (dirQueue.length < 2) {
      dirQueue.push({ x: nx, y: ny });
      dir = { x: dirQueue[0].x, y: dirQueue[0].y };
    }
  }

  function togglePause() {
    if (over) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
    draw();
  }

  function handleKey(e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') {
      e.preventDefault();
      queueDirection(0, -1);
    } else if (k === 'ArrowDown' || k === 's' || k === 'S') {
      e.preventDefault();
      queueDirection(0, 1);
    } else if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
      e.preventDefault();
      queueDirection(-1, 0);
    } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
      e.preventDefault();
      queueDirection(1, 0);
    } else if (k === ' ' || k === 'p' || k === 'P') {
      e.preventDefault();
      togglePause();
    } else if (k === 'Enter' && over) {
      e.preventDefault();
      reset();
    }
  }

  window.addEventListener('keydown', handleKey);

  restartBtn.addEventListener('click', reset);
  pauseBtn.addEventListener('click', togglePause);
  soundBtn.addEventListener('click', function () {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';
  });

  var dpadBtns = document.querySelectorAll('.dpad-btn');
  for (var i = 0; i < dpadBtns.length; i++) {
    dpadBtns[i].addEventListener('click', function () {
      var d = this.getAttribute('data-dir');
      if (d === 'up') queueDirection(0, -1);
      else if (d === 'down') queueDirection(0, 1);
      else if (d === 'left') queueDirection(-1, 0);
      else if (d === 'right') queueDirection(1, 0);
    });
  }

  // 门禁测试探针：只读状态 + 摆放食物，100% 兼容 backend/gate/mechanical.py
  window.__ogsProbe = {
    version: 1,
    state: function () {
      return {
        dir: { x: dir.x, y: dir.y },
        score: score,
        over: over,
        head: { x: snake[0].x, y: snake[0].y },
        length: snake.length,
        tickMs: tickMs
      };
    },
    placeFood: function (x, y) {
      food = { x: x, y: y };
    }
  };

  reset();
  rafId = requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
