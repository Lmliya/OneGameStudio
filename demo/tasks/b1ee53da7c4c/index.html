<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开罗红玉像素贪吃蛇 · Kairo Crimson Snake</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; image-rendering: pixelated; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #360808;
    background-image:
      radial-gradient(#4d0e0e 15%, transparent 16%),
      radial-gradient(#4d0e0e 15%, transparent 16%);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    color: #450a0a;
    font-family: 'Courier New', 'PingFang SC', monospace, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }
  .game-shell {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fdf2f2;
    border: 4px solid #7f1d1d;
    border-radius: 4px;
    padding: 12px 14px 14px;
    box-shadow:
      0 0 0 2px #260505,
      0 10px 0 #1f0404,
      0 14px 24px rgba(0, 0, 0, 0.65),
      inset 0 0 0 2px #fecaca;
    position: relative;
    max-width: 440px;
  }
  .top-bar {
    width: 400px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #991b1b;
    border: 3px solid #450a0a;
    border-radius: 4px;
    padding: 6px 10px;
    margin-bottom: 10px;
    box-shadow: inset 0 2px 0 #dc2626, 0 3px 0 #260505;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: #fff1f2;
    text-shadow: 1px 1px 0 #450a0a;
  }
  .brand-badge {
    background: #fde047;
    color: #450a0a;
    font-size: 10px;
    font-weight: 900;
    padding: 1px 5px;
    border: 2px solid #450a0a;
    border-radius: 3px;
    box-shadow: 1px 1px 0 #450a0a;
  }
  .ctrl-group {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    background: #fff1f2;
    color: #450a0a;
    border: 2px solid #450a0a;
    border-radius: 3px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 2px 0 #260505;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .icon-btn:hover { background: #fef08a; }
  .icon-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 #260505;
  }

  #hud {
    width: 400px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .stat-card {
    background: #fff5f5;
    border: 2px solid #991b1b;
    border-radius: 3px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: inset 0 1px 0 #ffffff, 0 2px 0 #450a0a;
  }
  .stat-label {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #991b1b;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 900;
    font-family: 'Courier New', monospace;
    color: #450a0a;
    margin-top: 1px;
  }
  #score { color: #dc2626; text-shadow: 1px 1px 0 #fecaca; }
  #best { color: #b91c1c; }
  #apples { color: #d97706; }
  #speed { color: #15803d; }

  .stage-wrap {
    position: relative;
    width: 400px;
    height: 400px;
    border: 4px solid #7f1d1d;
    border-radius: 3px;
    overflow: hidden;
    box-shadow:
      0 0 0 2px #260505,
      inset 0 0 8px rgba(38, 5, 5, 0.45);
    background: #681414;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }

  #restart {
    margin-top: 12px;
    padding: 8px 24px;
    background: #fde047;
    color: #450a0a;
    border: 3px solid #260505;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 900;
    font-family: inherit;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow:
      inset 0 2px 0 #fef08a,
      0 4px 0 #1f0404;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  #restart:hover {
    background: #facc15;
    transform: translateY(-1px);
    box-shadow:
      inset 0 2px 0 #fef9c3,
      0 5px 0 #1f0404;
  }
  #restart:active {
    transform: translateY(3px);
    box-shadow:
      inset 0 1px 0 #fef9c3,
      0 1px 0 #1f0404;
  }

  .footer-bar {
    width: 400px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 11px;
    font-weight: 700;
    color: #991b1b;
  }
  .dpad {
    display: flex;
    gap: 4px;
  }
  .dpad-btn {
    width: 26px;
    height: 24px;
    border-radius: 3px;
    border: 2px solid #450a0a;
    background: #fff1f2;
    color: #450a0a;
    font-size: 11px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 0 #260505;
  }
  .dpad-btn:hover { background: #fde047; }
  .dpad-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 #260505;
  }
</style>
</head>
<body>
  <div class="game-shell">
    <div class="top-bar">
      <div class="brand">
        <span class="brand-badge">红玉工坊</span>
        <span>开罗像素红枫贪吃蛇</span>
      </div>
      <div class="ctrl-group">
        <button type="button" class="icon-btn" id="pauseBtn" title="空格键暂停/继续">⏸ 暂停</button>
        <button type="button" class="icon-btn" id="soundBtn" title="切换8-bit音效">🔊 音效: 开</button>
      </div>
    </div>

    <div id="hud">
      <div class="stat-card">
        <span class="stat-label">🪙 收益</span>
        <span class="stat-val" id="score">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">🏆 纪录</span>
        <span class="stat-val" id="best">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">🍎 采摘</span>
        <span class="stat-val" id="apples">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">⚡ 等级</span>
        <span class="stat-val" id="speed">LV.1</span>
      </div>
    </div>

    <div class="stage-wrap">
      <canvas id="game" width="400" height="400"></canvas>
    </div>

    <button id="restart" hidden>🔄 重新开始</button>

    <div class="footer-bar">
      <span>⌨️ 方向键/WASD 移动 · 空格暂停</span>
      <div class="dpad">
        <button type="button" class="dpad-btn" data-dir="left" aria-label="左">◀</button>
        <button type="button" class="dpad-btn" data-dir="up" aria-label="上">▲</button>
        <button type="button" class="dpad-btn" data-dir="down" aria-label="下">▼</button>
        <button type="button" class="dpad-btn" data-dir="right" aria-label="右">▶</button>
      </div>
    </div>
  </div>

<script>
(function () {
  var CELL = 20, COLS = 20, BASE_TICK = 120;
  var STORAGE_KEY = 'ogs_kairo_crimson_snake_best_v1';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var applesEl = document.getElementById('apples');
  var speedEl = document.getElementById('speed');
  var restartBtn = document.getElementById('restart');
  var pauseBtn = document.getElementById('pauseBtn');
  var soundBtn = document.getElementById('soundBtn');

  var snake = [];
  var dir = { x: 1, y: 0 };
  var lastMovedDir = { x: 1, y: 0 };
  var dirQueue = [];
  var food = { x: 5, y: 5 };
  var bonusFood = null;
  var foodsEaten = 0;
  var score = 0;
  var bestScore = 0;
  var tickMs = BASE_TICK;
  var over = false;
  var paused = false;
  var newRecord = false;
  var timer = null;
  var rafId = null;
  var soundEnabled = true;
  var audioCtx = null;
  var particles = [];
  var popups = [];
  var shakeFrames = 0;
  var tongueFlick = false;
  var tickCount = 0;

  try {
    bestScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
  } catch (e) { bestScore = 0; }
  bestEl.textContent = String(bestScore);

  function playTone(freq, type, duration, vol, slideTo) {
    if (!soundEnabled) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function sfxEat() {
    playTone(587, 'square', 0.07, 0.08, 880);
    setTimeout(function () { playTone(880, 'square', 0.09, 0.07, 1174); }, 45);
  }
  function sfxBonus() {
    playTone(523, 'triangle', 0.07, 0.09, 659);
    setTimeout(function () { playTone(659, 'triangle', 0.07, 0.09, 784); }, 55);
    setTimeout(function () { playTone(784, 'triangle', 0.07, 0.09, 1046); }, 110);
    setTimeout(function () { playTone(1046, 'square', 0.16, 0.1, 1318); }, 165);
  }
  function sfxOver() {
    playTone(392, 'sawtooth', 0.16, 0.09, 220);
    setTimeout(function () { playTone(220, 'sawtooth', 0.24, 0.09, 90); }, 130);
  }

  function randCell() { return Math.floor(Math.random() * COLS); }

  function isOccupied(x, y) {
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
  }

  function placeFood() {
    var p, guard = 0;
    do {
      p = { x: randCell(), y: randCell() };
      guard++;
    } while (isOccupied(p.x, p.y) && guard < 500);
    food = p;
  }

  function maybeSpawnBonus() {
    if (bonusFood) return;
    var p, guard = 0;
    do {
      p = { x: randCell(), y: randCell(), ttl: 50, maxTtl: 50 };
      guard++;
    } while ((isOccupied(p.x, p.y) || (p.x === food.x && p.y === food.y)) && guard < 500);
    bonusFood = p;
  }

  function spawnBurst(gx, gy, colors, count) {
    var cx = gx * CELL + CELL / 2;
    var cy = gy * CELL + CELL / 2;
    var clrs = colors || ['#fde047', '#f59e0b', '#f87171', '#ef4444', '#ffffff'];
    for (var i = 0; i < (count || 16); i++) {
      var ang = (Math.PI * 2 * i) / (count || 16) + (Math.random() - 0.5) * 0.5;
      var spd = 1.4 + Math.random() * 2.8;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.5,
        size: 3 + Math.floor(Math.random() * 3),
        alpha: 1,
        color: clrs[Math.floor(Math.random() * clrs.length)]
      });
    }
  }

  function spawnPopup(gx, gy, text, color) {
    popups.push({
      x: gx * CELL + CELL / 2,
      y: gy * CELL + 4,
      text: text,
      color: color || '#fde047',
      alpha: 1,
      vy: -0.8
    });
  }

  function updateSpeed() {
    var target = Math.max(68, BASE_TICK - Math.floor(score / 30) * 6);
    if (target !== tickMs) {
      tickMs = target;
      if (timer && !over && !paused) {
        clearInterval(timer);
        timer = setInterval(tick, tickMs);
      }
    }
    var lvl = 1 + Math.floor((BASE_TICK - tickMs) / 10);
    speedEl.textContent = 'LV.' + lvl;
  }

  function addScore(pts, gx, gy, isBonus) {
    score += pts;
    scoreEl.textContent = String(score);
    if (score > bestScore) {
      bestScore = score;
      newRecord = true;
      bestEl.textContent = String(bestScore);
      try { localStorage.setItem(STORAGE_KEY, String(bestScore)); } catch (e) {}
    }
    updateSpeed();
    spawnPopup(gx, gy, '+' + pts + (isBonus ? ' 🏆' : ' 🍎'), isBonus ? '#fde047' : '#f87171');
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    lastMovedDir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    foodsEaten = 0;
    tickMs = BASE_TICK;
    over = false;
    paused = false;
    newRecord = false;
    bonusFood = null;
    particles = [];
    popups = [];
    shakeFrames = 0;
    tongueFlick = false;
    scoreEl.textContent = '0';
    applesEl.textContent = '0';
    speedEl.textContent = 'LV.1';
    pauseBtn.textContent = '⏸ 暂停';
    restartBtn.hidden = true;
    placeFood();
    if (timer) clearInterval(timer);
    timer = setInterval(tick, tickMs);
    draw();
  }

  function gameOver() {
    over = true;
    shakeFrames = 8;
    if (timer) clearInterval(timer);
    restartBtn.hidden = false;
    sfxOver();
    draw();
  }

  function tick() {
    if (over || paused) return;
    tickCount++;
    tongueFlick = (tickCount % 2 === 0);

    if (dirQueue.length > 0) {
      dir = dirQueue.shift();
    }
    lastMovedDir = { x: dir.x, y: dir.y };

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= COLS) {
      return gameOver();
    }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        return gameOver();
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      foodsEaten++;
      applesEl.textContent = String(foodsEaten);
      addScore(10, head.x, head.y, false);
      spawnBurst(head.x, head.y, ['#fde047', '#fef08a', '#f59e0b', '#ef4444', '#ffffff'], 18);
      sfxEat();
      placeFood();
      if (foodsEaten % 5 === 0) maybeSpawnBonus();
    } else if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
      addScore(30, head.x, head.y, true);
      spawnBurst(head.x, head.y, ['#fde047', '#facc15', '#fef08a', '#ffffff'], 24);
      sfxBonus();
      bonusFood = null;
    } else {
      snake.pop();
    }

    if (bonusFood) {
      bonusFood.ttl--;
      if (bonusFood.ttl <= 0) bonusFood = null;
    }

    if (dirQueue.length > 0) {
      dir = { x: dirQueue[0].x, y: dirQueue[0].y };
    }

    draw();
  }

  function updateEffects() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.vx *= 0.95;
      p.alpha -= 0.035;
      if (p.alpha <= 0) particles.splice(i, 1);
    }
    for (var j = popups.length - 1; j >= 0; j--) {
      var pop = popups[j];
      pop.y += pop.vy;
      pop.alpha -= 0.03;
      if (pop.alpha <= 0) popups.splice(j, 1);
    }
    if (shakeFrames > 0) shakeFrames--;
  }

  function drawPixelApple(gx, gy, now) {
    var bx = gx * CELL;
    var by = gy * CELL + Math.round(Math.sin(now * 0.007) * 1.5);

    // 金红苹果
    ctx.fillStyle = '#450a0a';
    ctx.fillRect(bx + 9, by + 1, 2, 4);

    ctx.fillStyle = '#10b981';
    ctx.fillRect(bx + 11, by + 2, 4, 3);
    ctx.fillStyle = '#6ee7b7';
    ctx.fillRect(bx + 12, by + 2, 2, 1);

    ctx.fillStyle = '#78350f';
    ctx.fillRect(bx + 4, by + 5, 12, 12);
    ctx.fillRect(bx + 5, by + 4, 10, 14);

    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(bx + 5, by + 6, 10, 10);
    ctx.fillRect(bx + 6, by + 5, 8, 12);

    ctx.fillStyle = '#fde047';
    ctx.fillRect(bx + 5, by + 6, 4, 4);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bx + 6, by + 7, 2, 2);
  }

  function drawPixelTrophy(gx, gy, bonus, now) {
    var bx = gx * CELL;
    var by = gy * CELL + Math.round(Math.sin(now * 0.012) * 1.5);

    ctx.fillStyle = '#78350f';
    ctx.fillRect(bx + 3, by + 3, 14, 10);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(bx + 4, by + 4, 12, 8);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bx + 5, by + 5, 3, 6);

    ctx.fillStyle = '#d97706';
    ctx.fillRect(bx + 2, by + 4, 2, 5);
    ctx.fillRect(bx + 16, by + 4, 2, 5);

    ctx.fillStyle = '#450a0a';
    ctx.fillRect(bx + 8, by + 12, 4, 2);
    ctx.fillRect(bx + 5, by + 14, 10, 3);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(bx + 6, by + 14, 8, 1);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bx + 9, by + 7, 2, 2);

    var pct = bonus.ttl / bonus.maxTtl;
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx + 1, by + 1, CELL - 2, CELL - 2);
  }

  function draw() {
    var now = Date.now();
    ctx.save();
    if (shakeFrames > 0) {
      var dx = (Math.random() - 0.5) * 4;
      var dy = (Math.random() - 0.5) * 4;
      ctx.translate(Math.round(dx), Math.round(dy));
    }

    // 1. 开罗复古红枫木/方砖棋盘格
    for (var r = 0; r < COLS; r++) {
      for (var c = 0; c < COLS; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#631313' : '#4d0d0d';
        ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
        ctx.fillStyle = '#852121';
        ctx.fillRect(c * CELL, r * CELL, 1, 1);
      }
    }

    // 2. 食物
    drawPixelApple(food.x, food.y, now);

    // 3. 奖杯
    if (bonusFood) {
      drawPixelTrophy(bonusFood.x, bonusFood.y, bonusFood, now);
    }

    // 4. 蛇身 (金红开罗吉祥物风格)
    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      var isHead = (i === 0);
      var sx = seg.x * CELL;
      var sy = seg.y * CELL;

      if (isHead) {
        ctx.fillStyle = '#450a0a';
        ctx.fillRect(sx + 1, sy + 1, 18, 18);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(sx + 2, sy + 2, 16, 16);

        ctx.fillStyle = '#fca5a5';
        ctx.fillRect(sx + 2, sy + 2, 16, 2);
        ctx.fillRect(sx + 2, sy + 2, 2, 16);
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(sx + 2, sy + 16, 16, 2);
        ctx.fillRect(sx + 16, sy + 2, 2, 16);

        ctx.fillStyle = '#fde047';
        if (dir.x !== 0) {
          ctx.fillRect(sx + 7, sy + 3, 3, 2);
          ctx.fillRect(sx + 7, sy + 15, 3, 2);
        } else {
          ctx.fillRect(sx + 3, sy + 7, 2, 3);
          ctx.fillRect(sx + 15, sy + 7, 2, 3);
        }

        var e1x, e1y, e2x, e2y;
        if (dir.x === 1) {
          e1x = sx + 10; e1y = sy + 4;
          e2x = sx + 10; e2y = sy + 12;
        } else if (dir.x === -1) {
          e1x = sx + 6; e1y = sy + 4;
          e2x = sx + 6; e2y = sy + 12;
        } else if (dir.y === 1) {
          e1x = sx + 4; e1y = sy + 10;
          e2x = sx + 12; e2y = sy + 10;
        } else {
          e1x = sx + 4; e1y = sy + 6;
          e2x = sx + 12; e2y = sy + 6;
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(e1x, e1y, 4, 4);
        ctx.fillRect(e2x, e2y, 4, 4);

        ctx.fillStyle = '#1e0505';
        var pxOff = dir.x > 0 ? 2 : (dir.x < 0 ? 0 : 1);
        var pyOff = dir.y > 0 ? 2 : (dir.y < 0 ? 0 : 1);
        ctx.fillRect(e1x + pxOff, e1y + pyOff, 2, 2);
        ctx.fillRect(e2x + pxOff, e2y + pyOff, 2, 2);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(e1x + pxOff, e1y + pyOff, 1, 1);
        ctx.fillRect(e2x + pxOff, e2y + pyOff, 1, 1);

        // 金冠
        var cx = sx + 6, cy = sy + 1;
        ctx.fillStyle = '#fde047';
        ctx.fillRect(cx, cy, 8, 3);
        ctx.fillRect(cx, cy - 2, 2, 2);
        ctx.fillRect(cx + 3, cy - 3, 2, 3);
        ctx.fillRect(cx + 6, cy - 2, 2, 2);
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(cx + 3, cy + 1, 2, 2);

        if (tongueFlick && !over) {
          ctx.fillStyle = '#fde047';
          if (dir.x === 1) {
            ctx.fillRect(sx + 19, sy + 9, 4, 2);
            ctx.fillRect(sx + 22, sy + 8, 1, 1);
            ctx.fillRect(sx + 22, sy + 11, 1, 1);
          } else if (dir.x === -1) {
            ctx.fillRect(sx - 3, sy + 9, 4, 2);
            ctx.fillRect(sx - 3, sy + 8, 1, 1);
            ctx.fillRect(sx - 3, sy + 11, 1, 1);
          } else if (dir.y === 1) {
            ctx.fillRect(sx + 9, sy + 19, 2, 4);
            ctx.fillRect(sx + 8, sy + 22, 1, 1);
            ctx.fillRect(sx + 11, sy + 22, 1, 1);
          } else if (dir.y === -1) {
            ctx.fillRect(sx + 9, sy - 3, 2, 4);
            ctx.fillRect(sx + 8, sy - 3, 1, 1);
            ctx.fillRect(sx + 11, sy - 3, 1, 1);
          }
        }
      } else {
        var isAlt = (i % 2 === 0);
        ctx.fillStyle = '#450a0a';
        ctx.fillRect(sx + 1, sy + 1, 18, 18);

        ctx.fillStyle = isAlt ? '#ef4444' : '#dc2626';
        ctx.fillRect(sx + 2, sy + 2, 16, 16);

        ctx.fillStyle = '#fca5a5';
        ctx.fillRect(sx + 2, sy + 2, 16, 2);
        ctx.fillRect(sx + 2, sy + 2, 2, 16);
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(sx + 2, sy + 16, 16, 2);
        ctx.fillRect(sx + 16, sy + 2, 2, 16);

        ctx.fillStyle = isAlt ? '#fde047' : '#f59e0b';
        ctx.fillRect(sx + 8, sy + 8, 4, 4);
      }
    }

    // 5. 粒子
    for (var k = 0; k < particles.length; k++) {
      var pt = particles[k];
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.alpha);
      ctx.fillStyle = pt.color;
      ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size);
      ctx.restore();
    }

    // 6. 飘字
    for (var m = 0; m < popups.length; m++) {
      var pop = popups[m];
      ctx.save();
      ctx.globalAlpha = Math.max(0, pop.alpha);
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#260505';
      ctx.fillText(pop.text, pop.x + 1, pop.y + 1);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, pop.x, pop.y);
      ctx.restore();
    }

    // 7. 暂停
    if (paused && !over) {
      ctx.fillStyle = 'rgba(38, 5, 5, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#7f1d1d';
      ctx.fillRect(70, 140, 260, 110);
      ctx.fillStyle = '#fff1f2';
      ctx.fillRect(74, 144, 252, 102);
      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 2;
      ctx.strokeRect(78, 148, 244, 94);

      ctx.fillStyle = '#991b1b';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('☕ 营业暂停中 · PAUSED', canvas.width / 2, 185);

      ctx.fillStyle = '#450a0a';
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillText('按空格键或点击顶部继续经营', canvas.width / 2, 215);
    }

    // 8. 结算单
    if (over) {
      ctx.fillStyle = 'rgba(38, 5, 5, 0.82)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var bx = 45, by = 48, bw = 310, bh = 304;
      ctx.fillStyle = '#7f1d1d';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#260505';
      ctx.strokeRect(bx, by, bw, bh);

      ctx.fillStyle = '#fff5f5';
      ctx.fillRect(bx + 4, by + 4, bw - 8, bh - 8);
      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx + 8, by + 8, bw - 16, bh - 16);

      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(bx + 14, by + 16, bw - 28, 32);
      ctx.fillStyle = '#450a0a';
      ctx.strokeRect(bx + 14, by + 16, bw - 28, 32);
      ctx.fillStyle = '#fff5f5';
      ctx.font = 'bold 15px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('★ 红玉工坊 · 营业决算 ★', canvas.width / 2, by + 37);

      ctx.fillStyle = '#450a0a';
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText('🪙 本局营业额: ' + score + ' G', bx + 34, by + 82);
      ctx.fillText('🏆 最高纪录:   ' + bestScore + ' G', bx + 34, by + 108);
      ctx.fillText('🍎 苹果采摘:   ' + foodsEaten + ' 颗', bx + 34, by + 134);
      ctx.fillText('⚡ 最终时速:   ' + (BASE_TICK / tickMs).toFixed(1) + 'x', bx + 34, by + 160);

      var rank = 'C', rankColor = '#15803d', rankTitle = '见习学徒';
      if (score >= 150) { rank = 'S'; rankColor = '#dc2626'; rankTitle = '特级工坊'; }
      else if (score >= 100) { rank = 'A'; rankColor = '#ea580c'; rankTitle = '经营能手'; }
      else if (score >= 50) { rank = 'B'; rankColor = '#2563eb'; rankTitle = '合格店长'; }

      ctx.save();
      ctx.translate(bx + 235, by + 118);
      ctx.rotate(-0.14);
      ctx.strokeStyle = rankColor;
      ctx.lineWidth = 3;
      ctx.strokeRect(-32, -26, 64, 52);
      ctx.fillStyle = rankColor;
      ctx.font = 'bold 22px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(rank + '级', 0, -2);
      ctx.font = 'bold 10px monospace';
      ctx.fillText(rankTitle, 0, 16);
      ctx.restore();

      if (newRecord && score > 0) {
        ctx.fillStyle = '#fde047';
        ctx.fillRect(bx + 24, by + 188, bw - 48, 24);
        ctx.fillStyle = '#450a0a';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('★ 创下红玉新纪录 NEW RECORD! ★', canvas.width / 2, by + 204);
      } else {
        ctx.fillStyle = '#991b1b';
        ctx.font = '11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('勤奋经营，下回冲刺特级工坊！', canvas.width / 2, by + 204);
      }

      ctx.fillStyle = '#7f1d1d';
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('点击下方「重新开始」或按 Enter', canvas.width / 2, by + 245);
      ctx.fillText('再开一局，带领红玉工坊再创辉煌！', canvas.width / 2, by + 266);
    }

    ctx.restore();
  }

  function renderLoop() {
    updateEffects();
    if (!over) draw();
    else if (shakeFrames > 0 || particles.length > 0) draw();
    rafId = requestAnimationFrame(renderLoop);
  }

  function queueDirection(nx, ny) {
    if (over || paused) return;
    var ref = dirQueue.length > 0 ? dirQueue[dirQueue.length - 1] : lastMovedDir;
    if (nx === -ref.x && ny === -ref.y) return;
    if (nx === ref.x && ny === ref.y) return;
    if (dirQueue.length < 2) {
      dirQueue.push({ x: nx, y: ny });
      dir = { x: dirQueue[0].x, y: dirQueue[0].y };
    }
  }

  function togglePause() {
    if (over) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
    draw();
  }

  function handleKey(e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') {
      e.preventDefault();
      queueDirection(0, -1);
    } else if (k === 'ArrowDown' || k === 's' || k === 'S') {
      e.preventDefault();
      queueDirection(0, 1);
    } else if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
      e.preventDefault();
      queueDirection(-1, 0);
    } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
      e.preventDefault();
      queueDirection(1, 0);
    } else if (k === ' ' || k === 'p' || k === 'P') {
      e.preventDefault();
      togglePause();
    } else if (k === 'Enter' && over) {
      e.preventDefault();
      reset();
    }
  }

  window.addEventListener('keydown', handleKey);

  restartBtn.addEventListener('click', reset);
  pauseBtn.addEventListener('click', togglePause);
  soundBtn.addEventListener('click', function () {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊 音效: 开' : '🔇 音效: 关';
  });

  var dpadBtns = document.querySelectorAll('.dpad-btn');
  for (var i = 0; i < dpadBtns.length; i++) {
    dpadBtns[i].addEventListener('click', function () {
      var d = this.getAttribute('data-dir');
      if (d === 'up') queueDirection(0, -1);
      else if (d === 'down') queueDirection(0, 1);
      else if (d === 'left') queueDirection(-1, 0);
      else if (d === 'right') queueDirection(1, 0);
    });
  }

  window.__ogsProbe = {
    version: 1,
    state: function () {
      return {
        dir: { x: dir.x, y: dir.y },
        score: score,
        over: over,
        head: { x: snake[0].x, y: snake[0].y },
        length: snake.length,
        tickMs: tickMs
      };
    },
    placeFood: function (x, y) {
      food = { x: x, y: y };
    }
  };

  reset();
  rafId = requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
